---

name: nodejs-service-deployment-workflow with SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04

    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      RSYNC_RSH: "ssh -o StrictHostKeyChecking=no"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout Node.js application
        uses: actions/checkout@v5
        with:
          repository: JescAude18/my-nodejs-service
          path: my-nodejs-service

      - name: Setup SSH key to connect to VM
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create application directory
        uses: appleboy/ssh-action@v1
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          USER: ${{ secrets.SERVER_USER }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: 
            SUDO_PASSWORD,USER
          script: |
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S mkdir -p /var/www/my-nodejs-service
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S chown -R "$USER":"$USER" /var/www/my-nodejs-service

      - name: Update nodejs service files on the VM
        run: |
          rsync -a -v -z  ./my-nodejs-service/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/my-nodejs-service/

      - name: Run deployment commands on VM
        uses: appleboy/ssh-action@v1
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: 
            SUDO_PASSWORD
          script: |
            cd /var/www/my-nodejs-service/
            npm install
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S systemctl restart nodejs-service.service
